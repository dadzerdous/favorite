<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Restaurant Picker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ffdf8a, #b32020 55%, #380808);
      color: white;
      padding: 20px;
    }

    .card {
      width: min(430px, 100%);
      background: rgba(0,0,0,0.45);
      border: 3px solid #ffd166;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    .option {
      margin: 10px 0;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.1);
      font-size: 1.1rem;
    }

    #result {
      margin: 20px 0;
      padding: 20px;
      min-height: 80px;
      border-radius: 18px;
      background: rgba(255,209,102,0.15);
      border: 2px dashed rgba(255,209,102,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #ffd166;
      color: #3a0808;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #a96d00;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #a96d00;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🥡 Dinner Picker</h1>

    <div class="option">🌙 Main Moon</div>
    <div class="option">🍣 Hanami</div>
    <div class="option">🥢 Little Hunan</div>

    <div id="result">Tap the button!</div>

    <button onclick="pickRestaurant()">
      Pick Dinner
    </button>
  </div>

  <script>
    const restaurants = [
      "🌙 Main Moon",
      "🍣 Hanami",
      "🥢 Little Hunan"
    ];

    function pickRestaurant() {
      const random =
        restaurants[Math.floor(Math.random() * restaurants.length)];

      document.getElementById("result").textContent = random;
    }
  </script>

</body>
</html>
